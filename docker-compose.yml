services:
  octane-ai:
    build: .
    image: octane-ai:local
    container_name: octane-ai
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "127.0.0.1:8787:8787"

