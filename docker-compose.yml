services:
  octane-ai:
    build: .
    image: ghcr.io/hafidzrizqullahprasetya/octane-ai:latest
    container_name: octane-ai
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    labels:
      - "com.centurylinklabs.watchtower.scope=octane"
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom
      - octane-zai

  octane-zai:
    build: ../octane-zai
    container_name: octane-zai
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      - "com.centurylinklabs.watchtower.scope=octane"
    ports:
      - "127.0.0.1:18787:18787"
    volumes:
      - ./data-octanezai:/data
    environment:
      OCTANE_ZAI_DIR: /data
      PORT: "18787"
      HOSTNAME: "0.0.0.0"

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      - "com.centurylinklabs.watchtower.scope=octane"
    ports:
      - "127.0.0.1:8787:8787"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    mem_limit: 128m
    memswap_limit: 128m
    labels:
      - "com.centurylinklabs.watchtower.scope=octane"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/hafidzprasetya/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_SCOPE=octane
      - WATCHTOWER_INCLUDE_STOPPED=false
